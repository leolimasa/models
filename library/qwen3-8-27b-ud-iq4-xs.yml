# Dense hybrid attention/SSM model (65 layers, full_attention_interval=4 --
# only 1 in 4 layers is full attention, the rest are linear/SSM with
# fixed-size state). At 13.3 GiB it needs both GPUs.
#
# `-sm tensor` is the win here: 22.6 -> 34.6 tok/s generation (+53%),
# measured back-to-back against the old config on the same machine.
# The default layer split runs the GPUs *sequentially* -- one holds layers
# 0..n, the other n+1..64, and each waits on the other -- and it sizes the
# split by VRAM, handing the 3070 only 4.4 GiB of the 12.7 GiB of weights
# while the slower 3060 carried 8.3 GiB. So the faster card sat idle with
# ~3 GiB free. `-sm tensor` splits every tensor evenly instead (6.4 GiB per
# GPU) and both cards compute at once. That also explains why no `-ts`
# ratio ever moved the old number much: rebalancing a sequential split is
# worth a few percent, running the two cards in parallel is worth ~53%.
#
# THE CATCH, and the reason ctx is 16384 and not 32768: an even split is
# capped by the *smaller* card. 6.4 GiB of weights sit on the 3070's
# 7.84 GiB, leaving ~1.4 GiB for KV + compute, while the 3060 idles with
# ~4.7 GiB it cannot be given. All three ways to rebalance it fail:
#   -ts <ratio>   aborts in the meta backend (ggml-backend-meta.cpp)
#   -sm row       won't load: "device CUDA0 does not support split buffers"
#                 (no PCIe P2P between these two GeForce cards)
#   -ot ...=CUDA1 aborts: "pre-allocated tensor (blk.0.attn_norm.weight) in
#                 a buffer (CUDA1) that cannot run the operation" -- pinning
#                 tensors to a concrete device breaks the meta backend's
#                 graph, whether you pin whole layers or just ffn weights.
# So context size is the only lever on memory, and it is not optional:
# ctx 32768 measured 713 MiB of headroom and OOM'd in real interactive use
# after two turns. ctx 16384 measured 1081 MiB and costs ~nothing in speed
# (34.6 vs 34.8 tok/s) because this architecture's KV is small to begin
# with -- only 16 of 65 layers hold one.
#
# cache_type q8_0 is also load-bearing, not a nicety: f16 KV at this ctx
# lands back at ~713 MiB headroom. It costs ~6% generation at depth.
# -ub 256 -b 1024 halves the compute buffer for ~5% prompt throughput and
# nothing on generation. -b 1024 vs 2048 measured identical; it is kept
# only to hold the logical batch down, and that is what was stress-tested.
#
# Net vs the old layer-split config, same machine, same run:
#   generation  22.58 -> 34.6 tok/s  (+53%)  <- what you actually wait on
#   prompt     661.21 -> ~611 tok/s  (-7.6%) <- the price, from -ub 256
#
# `--jinja` is required, not optional: without it, chat-formatted requests
# (server /v1/chat/completions, and interactive -cnv mode) crash with
# "std::bad_alloc" applying this model's Jinja chat template. Raw -p
# completion (no template) works fine either way, which is why this was
# easy to miss with a quick smoke test.
#
# Verifying a change to this file: a one-shot `PROMPT=... run` is NOT
# enough. It missed two separate OOMs here. Test (a) multi-turn -cnv, the
# default path, (b) server mode, which needs ~300 MiB more than cli, and
# watch `nvidia-smi` throughout rather than trusting a clean exit.
name: Qwen3.8-27B-UD-IQ4_XS
file: Qwen3.8-27B-UD-IQ4_XS.gguf
url: https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-IQ4_XS.gguf?download=true
runner: llamacpp
llamacpp:
  mode: cli
  ctx: 16384
  cache_type: q8_0
  extra_args: ["--jinja", "-sm", "tensor", "-ub", "256", "-b", "1024"]
